name: Publish PoloDeck containers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: api
            image: polodeck-api
            context: api
            dockerfile: api/Dockerfile
          - name: web
            image: polodeck-web
            context: .
            dockerfile: web-app/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

  installer:
    name: Publish installer bundle
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build installer archives
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^POLODECK_VERSION=.*/POLODECK_VERSION=${VERSION}/" deploy/.env.example
          tar -czf "polodeck-installer-${VERSION}.tar.gz" deploy
          zip -r "polodeck-installer-${VERSION}.zip" deploy
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" polodeck-installer-* --generate-notes --verify-tag
