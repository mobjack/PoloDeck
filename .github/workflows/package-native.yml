# Smoke-build the native app tree (no GitHub Release).
#
# Runs on:
# - pull requests that touch packaging / app paths
# - pushes to main that touch those paths
# - manual Run workflow
#
# Does NOT publish installers. For publishing, use "Release native packages"
# (tag v* or workflow_dispatch).

name: Native package build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - "web-app/**"
      - "packaging/**"
      - "pi/**"
      - ".github/workflows/package-native.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "web-app/**"
      - "packaging/**"
      - "pi/**"
      - ".github/workflows/package-native.yml"

jobs:
  build-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web-app/package-lock.json
      - name: Build app tree
        run: ./packaging/scripts/build-app.sh
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: polodeck-app
          path: packaging/dist/app
