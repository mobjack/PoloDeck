# Build native installers and attach them to a GitHub Release.
#
# When this runs:
# - Push a version tag such as v0.1.0 (usually created from main)
# - Or Actions → "Release native packages" → Run workflow (any branch you select)
#
# This does NOT run on every push to feature branches.

name: Release native packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without v prefix (e.g. 0.1.0). Empty = packaging/VERSION or tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < packaging/VERSION)"
          fi
          echo "version=${V}" >>"$GITHUB_OUTPUT"
          echo "${V}" > packaging/VERSION
          echo "Building version ${V}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web-app/package-lock.json

      - name: Install PostgreSQL 16 (bundled into package)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 rsync

      - name: Build runtime + app + .deb
        env:
          POLODECK_COPY_SYSTEM_PG: "1"
        run: |
          ./packaging/scripts/build-runtime.sh
          ./packaging/scripts/build-app.sh
          ./packaging/scripts/build-deb.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            packaging/dist/polodeck_*.deb
            packaging/dist/polodeck_*.deb.sha256

  release-macos:
    name: Build macOS .pkg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < packaging/VERSION)"
          fi
          echo "version=${V}" >>"$GITHUB_OUTPUT"
          echo "${V}" > packaging/VERSION
          echo "Building version ${V}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web-app/package-lock.json

      - name: Install PostgreSQL 16 (bundled into package)
        run: brew install postgresql@16 rsync

      - name: Build runtime + app + .pkg
        env:
          POLODECK_COPY_SYSTEM_PG: "1"
          PATH: /opt/homebrew/opt/postgresql@16/bin:/usr/local/opt/postgresql@16/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          ./packaging/scripts/build-runtime.sh
          ./packaging/scripts/build-app.sh
          ./packaging/scripts/build-pkg.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: |
            packaging/dist/PoloDeck-*-arm64.pkg
            packaging/dist/PoloDeck-*-arm64.pkg.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [release-linux, release-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version / tag
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < packaging/VERSION)"
          fi
          echo "version=${V}" >>"$GITHUB_OUTPUT"
          echo "tag=v${V}" >>"$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f | sort

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PoloDeck ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            release-assets/*.deb
            release-assets/*.deb.sha256
            release-assets/*.pkg
            release-assets/*.pkg.sha256
          body: |
            ## Install

            - **macOS (Apple Silicon):** download `PoloDeck-${{ steps.ver.outputs.version }}-arm64.pkg` — see [packaging/INSTALL-MAC.md](https://github.com/mobjack/PoloDeck/blob/main/packaging/INSTALL-MAC.md)
            - **Linux (Ubuntu amd64):** download `polodeck_${{ steps.ver.outputs.version }}_amd64.deb` — see [packaging/INSTALL-LINUX.md](https://github.com/mobjack/PoloDeck/blob/main/packaging/INSTALL-LINUX.md)

            macOS packages are currently **unsigned**; see the Mac install guide if Gatekeeper blocks the installer.

            Releases page: https://github.com/mobjack/PoloDeck/releases
