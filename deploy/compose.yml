name: polodeck

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - polodeck-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  polodeck-api:
    image: ghcr.io/mobjack/polodeck-api:${POLODECK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    expose:
      - "3000"

  web-app:
    image: ghcr.io/mobjack/polodeck-web:${POLODECK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      polodeck-api:
        condition: service_healthy
    ports:
      - "${POLODECK_BIND_ADDRESS:-0.0.0.0}:${POLODECK_PORT:-8080}:80"

volumes:
  polodeck-postgres-data:
